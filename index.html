<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ Thống Phân Tích OEE & Sản Lượng</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 10px; border-top: 4px solid #10b981; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .oee-badge { font-size: 24px; font-weight: bold; color: #2563eb; }
        .btn-update { background: #2563eb; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <h2>BẢNG GIÁM SÁT OEE NHÀ MÁY</h2>
        <div>
            Xin chào: <strong>{{ user.username }}</strong> ({{ user.role }}) | 
            <a href="/logout">Đăng xuất</a>
        </div>
    </div>
    
    <div class="grid" id="cards"></div>

    <script>
        async function updateData(machineId) {
            const total = prompt("Nhập tổng sản lượng máy làm được:");
            const good = prompt("Nhập số sản phẩm ĐẠT chuẩn:");
            if(total && good) {
                await fetch('/api/update-production', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ machine_id: machineId, total_count: parseInt(total), good_count: parseInt(good) })
                });
                alert("Đã cập nhật sản lượng!");
                loadDashboard();
            }
        }

        async function loadDashboard() {
            const res = await fetch('/api/dashboard');
            const data = await res.json();
            const cardsDiv = document.getElementById('cards');
            cardsDiv.innerHTML = '';
            
            data.forEach(m => {
                cardsDiv.innerHTML += `
                    <div class="card">
                        <h3>${m.machine_name}</h3>
                        <p>Trạng thái: <strong>${m.status}</strong></p>
                        <p>OEE: <span class="oee-badge">${m.OEE}%</span></p>
                        <p>Tổng sản lượng: ${m.total_produced} (Đạt: ${m.total_good} | Lỗi: ${m.total_defect})</p>
                        <button class="btn-update" onclick="updateData(${m.machine_id})">+ Nhập báo cáo ca</button>
                    </div>
                `;
            });
        }
        loadDashboard();
    </script>
</body>
</html>
